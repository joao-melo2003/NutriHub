services:

  database:
    image: mariadb:11.8
    container_name: nutrihub-database

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: nutrihub-backend
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - database
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend

    container_name: nutrihub-frontend

    depends_on:
      - backend

    ports:
      - "3000:3000"
volumes:
  mariadb_data:
